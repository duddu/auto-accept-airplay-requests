name: Unit Testing

on:
  push:
    branches:
      - latest
  pull_request:
    branches:
      - latest

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  
defaults:
  run:
    shell: bash
  
jobs:
  swift:
    name: Swift Testing
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Swift
        uses: swift-actions/setup-swift@d4537ff835c9778c934e48f78639e270edd5839e
        with:
          swift-version: 6
      - name: Swift Test Package
        working-directory: 'Accept AirPlay Requests'
        run: swift test -v
